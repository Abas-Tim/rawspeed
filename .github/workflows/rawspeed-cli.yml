name: rawspeed-cli publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release (e.g. 1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "rawspeed-cli-v*"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Abas-Tim/RAWtoJXL
          ref: feat/rawspeed-fork-integration
          submodules: recursive

      - name: Configure
        run: >
          cmake -S native -B build -A x64
          -DCMAKE_CXX_FLAGS="/Zc:preprocessor;/utf-8"
          -DWITH_OPENMP=OFF -DBUILD_TESTING=OFF -DBUILD_BENCHMARKING=OFF
          -DWITH_JPEG=OFF
          -DWITH_PUGIXML=ON -DUSE_BUNDLED_PUGIXML=ON
          -DPUGIXML_PATH=${{ github.workspace }}/native/rawspeed/third_party/pugixml-1.14
          -DALLOW_DOWNLOADING_PUGIXML=OFF
          -DWITH_ZLIB=ON -DUSE_BUNDLED_ZLIB=ON
          -DZLIB_PATH=${{ github.workspace }}/native/rawspeed/third_party/zlib-1.3.1
          -DALLOW_DOWNLOADING_ZLIB=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target rawspeed-cli

      - name: Smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter rawspeed-cli.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            throw "rawspeed-cli.exe not found under build/"
          }
          $r = & $exe.FullName 2>&1
          $code = $LASTEXITCODE
          "exe: $($exe.FullName)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "exit: $code" | Add-Content $env:GITHUB_STEP_SUMMARY
          "output: $r" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (("$r" -notmatch 'usage: rawspeed-cli') -and $code -ne 2) {
            throw "rawspeed-cli smoke test failed: exe=$($exe.FullName) exit=$code output=[$r]"
          }
          Write-Output "smoke test ok: $($exe.FullName) (usage printed, exit $code)"

      - name: Stage + checksum
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace "^rawspeed-cli-v", "" } else { "${{ inputs.version }}" }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item .\build\Release\rawspeed-cli.exe pkg\ -Force
          Get-ChildItem .\build\Release -Filter *.dll | Copy-Item -Destination pkg\ -Force
          $zip = "rawspeed-cli-win-x64-v$ver.zip"
          Compress-Archive -Path pkg\* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File "$zip.sha256" -Encoding ASCII
          "ZIP=$zip" >> $env:GITHUB_ENV
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ env.VER }}"
          $tag = "rawspeed-cli-v$ver"
          $zip = "rawspeed-cli-win-x64-v$ver.zip"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $repo = $env:GITHUB_REPOSITORY
          $rid = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
            $rid = $existing.id
            Write-Output "release for $tag already exists (id $rid); updating assets only"
          } catch {
            $payload = @{ tag_name = $tag; name = "rawspeed-cli v$ver"; body = "Prebuilt rawspeed-cli built from RAWtoJXL native/ workspace (fork msvc-win + vendored pugixml/zlib)." } | ConvertTo-Json
            $created = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -Body $payload -ContentType "application/json"
            $rid = $created.id
            Write-Output "created release $tag (id $rid)"
          }
          $asset = Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$repo/releases/$rid/assets?name=$zip" `
            -Headers $headers -ContentType "application/zip" -InFile (Resolve-Path $zip)
          Write-Output "asset uploaded: $($asset.name) ($($asset.size) bytes)"
          $ash = Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$repo/releases/$rid/assets?name=$zip.sha256" `
            -Headers $headers -ContentType "text/plain" -InFile (Resolve-Path "$zip.sha256")
          Write-Output "checksum uploaded: $($ash.name)"
