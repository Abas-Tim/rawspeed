name: Validate source/target branches of Pull Request

on:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - if: github.base_ref != 'develop'
        name: Close Pull
        run: gh pr close --comment "Pull Requests should only be submitted to `develop` branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.head_ref == github.base_ref
        name: Close Pull
        run: gh pr close --comment "Pull Requests source branch should be branched off of the Pull Request's target branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
